<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>禊カウンター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
</head>
<body>
<style>
/* Layout: one narrow column like a shrine ledger (帳面) — person switch, alerts, rule cards, log, settings */
:root {
  --bg: #f2f4f7;
  --surface: #ffffff;
  --ink: #1b2433;
  --muted: #5d6878;
  --line: #d8dde6;
  --ai: #23407a;
  --ai-soft: #e3e9f5;
  --shu: #c3361f;
  --shu-soft: #fbe8e3;
  --font-display: "Yuji Syuku", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e141e; --surface: #172030; --ink: #e6eaf1; --muted: #97a2b4; --line: #29344a;
    --ai: #92b2ee; --ai-soft: #1e2b44; --shu: #ff7c5e; --shu-soft: #3a1d18; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e141e; --surface: #172030; --ink: #e6eaf1; --muted: #97a2b4; --line: #29344a;
  --ai: #92b2ee; --ai-soft: #1e2b44; --shu: #ff7c5e; --shu-soft: #3a1d18; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 22px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }

header { display: flex; align-items: center; gap: 12px; }
header svg { flex: none; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 32px; line-height: 1.1; margin: 0; letter-spacing: .04em; }
.sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
.status { font-size: 12px; color: var(--muted); }
.status.warn { color: var(--shu); }

.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 10px 8px; font-weight: 700; display: flex; justify-content: center; align-items: center; gap: 8px; min-width: 0; }
.seg button[aria-pressed="true"] { background: var(--ai); color: var(--surface); }
.badge { font-size: 11px; font-weight: 700; background: var(--shu); color: #fff; border-radius: 99px; padding: 1px 7px; }

.section-label { font-size: 12px; letter-spacing: .12em; color: var(--muted); margin: 0 0 8px; }
.cards { display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.card.due { border-color: var(--shu); box-shadow: 0 0 0 3px var(--shu-soft); }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.card-top > div { min-width: 0; }
.rule-name { font-weight: 700; font-size: 17px; margin: 0; overflow-wrap: anywhere; }
.penance { font-size: 13px; color: var(--muted); margin: 2px 0 0; overflow-wrap: anywhere; }
.penance b { color: var(--ink); font-weight: 500; }
.count { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; line-height: 1; }
.count strong { font-size: 34px; font-weight: 700; }
.count span { color: var(--muted); font-size: 14px; }
.card.due .count strong { color: var(--shu); }
.done-times { font-size: 11px; color: var(--muted); margin-top: 6px; }

.beads { display: flex; flex-wrap: wrap; gap: 5px; }
.bead { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--line); }
.bead.on { background: var(--ai); border-color: var(--ai); }
.card.due .bead.on { background: var(--shu); border-color: var(--shu); }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ai); border-radius: inherit; }
.card.due .bar i { background: var(--shu); }

.due-note { background: var(--shu-soft); color: var(--shu); border-radius: 10px; padding: 10px 12px; font-weight: 700; font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.actions { display: flex; gap: 8px; align-items: center; }
.actions input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 12px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 700; white-space: nowrap; }
.btn.primary { background: var(--ai); border-color: var(--ai); color: var(--surface); }
.btn.shu { background: var(--shu); border-color: var(--shu); color: #fff; }
.btn.ghost { background: transparent; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: default; }

.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 20px; color: var(--muted); text-align: center; }

.log { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.log ul { list-style: none; margin: 0; padding: 0; }
.log li { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 14px; }
.log li:first-child { border-top: 0; }
.log .kind { font-size: 11px; font-weight: 700; border-radius: 6px; padding: 2px 6px; flex: none; background: var(--ai-soft); color: var(--ai); }
.log .kind.m { background: var(--shu-soft); color: var(--shu); }
.log .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.log .txt small { color: var(--muted); display: block; font-size: 12px; }
.log time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.x { border: 0; background: transparent; color: var(--muted); padding: 4px 6px; border-radius: 6px; }
.x.armed { color: var(--shu); font-weight: 700; font-size: 12px; }

details.settings { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
details.settings summary { padding: 14px 16px; font-weight: 700; cursor: pointer; }
.settings-body { padding: 0 16px 16px; display: grid; gap: 20px; }
.settings h3 { font-size: 13px; letter-spacing: .1em; color: var(--muted); margin: 0 0 8px; font-weight: 500; }
.field { display: grid; gap: 4px; }
.field label { font-size: 12px; color: var(--muted); }
.field input { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 12px; width: 100%; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form { display: grid; gap: 10px; }
.rule-rows { display: grid; gap: 6px; }
.rule-row { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 14px; }
.rule-row span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.rule-row small { color: var(--muted); }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); z-index: 20; }
@media (max-width: 380px) { .grid2 { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: no-preference) {
  .card.pulse { animation: pulse .5s ease; }
  @keyframes pulse { 40% { transform: scale(1.015); } }
}
</style>

<div class="wrap">
  <header>
    <svg width="28" height="44" viewBox="0 0 28 44" aria-hidden="true">
      <line x1="2" y1="2" x2="26" y2="2" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
      <polyline points="8,4 20,4 8,16 20,16 8,28 20,28 14,42" fill="none" stroke="var(--ai)" stroke-width="2.4" stroke-linejoin="round"/>
    </svg>
    <div>
      <h1>禊カウンター</h1>
      <p class="sub">やらかしを数え、溜まったら禊で清める。</p>
    </div>
  </header>

  <div class="seg" id="seg" role="group" aria-label="誰の記録か"></div>
  <p class="status" id="status">読み込み中…</p>

  <section>
    <p class="section-label">罪の帳面</p>
    <div class="cards" id="cards"></div>
  </section>

  <section>
    <p class="section-label">最近の記録</p>
    <div class="log" id="log"></div>
  </section>

  <details class="settings" id="settings">
    <summary>設定（名前・ルール）</summary>
    <div class="settings-body">
      <div>
        <h3>ふたりの名前</h3>
        <form class="grid2" id="peopleForm">
          <div class="field"><label for="nameA">ひとり目</label><input id="nameA" maxlength="12"></div>
          <div class="field"><label for="nameB">ふたり目</label><input id="nameB" maxlength="12"></div>
          <button class="btn" type="submit">名前を保存</button>
        </form>
      </div>
      <div>
        <h3 id="ruleFormTitle">ルールを追加</h3>
        <form class="form" id="ruleForm">
          <div class="field"><label for="ruleName">やらかしの内容</label><input id="ruleName" maxlength="30" placeholder="例：デートのドタキャン" required></div>
          <div class="grid2">
            <div class="field"><label for="ruleThreshold">何回で禊？</label><input id="ruleThreshold" type="number" min="1" max="999" inputmode="numeric" placeholder="3" required></div>
            <div class="field"><label for="rulePenance">禊の内容</label><input id="rulePenance" maxlength="40" placeholder="例：焼肉を奢る" required></div>
          </div>
          <div class="actions">
            <button class="btn primary" type="submit" id="ruleSubmit">追加する</button>
            <button class="btn ghost" type="button" id="ruleCancel" hidden>編集をやめる</button>
          </div>
        </form>
      </div>
      <div>
        <h3>ルール一覧</h3>
        <div class="rule-rows" id="ruleRows"></div>
      </div>
    </div>
  </details>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const S = { rules: [], offenses: [], misogi: [], people: { a: "わたし", b: "あいて" } };
let who = "a";
let mode = "loading";
let editingRule = null;
const armed = new Set();

try { const w = localStorage.getItem("misogi-who"); if (w === "a" || w === "b") who = w; } catch (e) {}

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 2400);
}

/* ---------- storage: shared db when available, this browser otherwise ---------- */
let db = null;
const LS_KEY = "misogi-local-v1";
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

async function write(fn) {
  try { await fn(); }
  catch (e) {
    const code = e && e.code;
    if (code === "quota_exceeded") toast("保存できる件数の上限です。古い記録を削除してください");
    else if (code === "invalid_argument") toast("保存できませんでした。編集できる権限があるか確認してください");
    else toast("保存できませんでした。通信状態を確認して、もう一度お試しください");
  }
}
const api = {
  add(col, data) {
    if (db) return write(() => db.collection(col).add(data));
    S[col].push({ id: uid(), ...data }); saveLocal(); render();
  },
  set(col, id, data) {
    if (db) return write(() => db.collection(col).doc(id).set(data));
    const i = S[col].findIndex((x) => x.id === id); if (i >= 0) S[col][i] = { id, ...data }; saveLocal(); render();
  },
  del(col, id) {
    if (db) return write(() => db.collection(col).doc(id).delete());
    S[col] = S[col].filter((x) => x.id !== id); saveLocal(); render();
  },
  people(p) {
    if (db) return write(() => db.doc("config/people").set(p));
    S.people = p; saveLocal(); render();
  },
};

function startLocal() {
  mode = "local";
  try { const raw = localStorage.getItem(LS_KEY); if (raw) Object.assign(S, JSON.parse(raw)); } catch (e) {}
  $("#status").textContent = "この端末だけに保存しています（共有されません）";
  fillPeopleForm(); render();
}

function startDb() {
  mode = "db";
  const answered = new Set();
  const timer = setTimeout(() => { const st = $("#status"); st.textContent = "データに接続できていません。表示が古い可能性があります"; st.className = "status warn"; }, 10000);
  const ok = (snap, name) => {
    if (snap.metadata.fromCache || answered.has(name)) return;
    answered.add(name);
    if (answered.size === 4) {
      clearTimeout(timer); const st = $("#status"); st.textContent = "ふたりで共有中"; st.className = "status";
    }
  };
  const fail = () => { clearTimeout(timer); const st = $("#status"); st.textContent = "データを読み込めませんでした。ページを開き直してください"; st.className = "status warn"; };
  for (const col of ["rules", "offenses", "misogi"]) {
    db.collection(col).onSnapshot((snap) => {
      S[col] = snap.docs.map((d) => ({ id: d.id, ...d.data() })); ok(snap, col); render();
    }, fail);
  }
  db.doc("config/people").onSnapshot((snap) => {
    if (snap.exists) S.people = { ...S.people, ...snap.data() };
    ok(snap, "people"); fillPeopleForm(); render();
  }, fail);
}

(async () => {
  let d = null;
  try { d = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { d = null; }
  if (d) { db = d; startDb(); } else startLocal();
})();

/* ---------- derived numbers ---------- */
function stats(ruleId, p) {
  const offs = S.offenses.filter((o) => o.rule === ruleId && o.who === p).length;
  const ms = S.misogi.filter((m) => m.rule === ruleId && m.who === p);
  const consumed = ms.reduce((s, m) => s + (Number(m.consumed) || 0), 0);
  return { count: Math.max(0, offs - consumed), done: ms.length };
}
const sortedRules = () => [...S.rules].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
const fmt = (t) => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };

/* ---------- render ---------- */
function render() {
  // person switch
  const dueOf = (p) => S.rules.filter((r) => stats(r.id, p).count >= (Number(r.threshold) || 1)).length;
  $("#seg").innerHTML = ["a", "b"].map((p) => {
    const n = dueOf(p);
    return `<button type="button" data-who="${p}" aria-pressed="${who === p}">${esc(S.people[p])}${n ? `<span class="badge">禊 ${n}</span>` : ""}</button>`;
  }).join("");

  // cards (keep typed memos and focus across re-renders)
  const memos = {}; document.querySelectorAll("[data-memo]").forEach((i) => { memos[i.dataset.memo] = i.value; });
  const focused = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.memo : null;
  const rules = sortedRules();
  if (!rules.length) {
    $("#cards").innerHTML = mode === "loading"
      ? `<div class="empty">読み込み中…</div>`
      : `<div class="empty">まだルールがありません。<br>下の「設定」から、やらかしの内容と禊を決めてください。</div>`;
  } else {
    $("#cards").innerHTML = rules.map((r) => {
      const th = Math.max(1, Number(r.threshold) || 1);
      const { count, done } = stats(r.id, who);
      const due = count >= th;
      const vis = th <= 40
        ? `<div class="beads" aria-hidden="true">${Array.from({ length: th }, (_, i) => `<span class="bead${i < count ? " on" : ""}"></span>`).join("")}</div>`
        : `<div class="bar" aria-hidden="true"><i style="width:${Math.min(100, (count / th) * 100)}%"></i></div>`;
      const mk = `m-${r.id}`;
      return `<article class="card${due ? " due" : ""}" data-card="${r.id}">
        <div class="card-top">
          <div><p class="rule-name">${esc(r.name)}</p><p class="penance">${th}回で禊：<b>${esc(r.penance)}</b></p></div>
          <div class="count" aria-label="${count}回 / ${th}回"><strong>${count}</strong><span> / ${th}</span>${done ? `<div class="done-times">禊 ${done}回済</div>` : ""}</div>
        </div>
        ${vis}
        ${due ? `<div class="due-note"><span>禊の時です。「${esc(r.penance)}」</span>
          <button class="btn shu small" type="button" data-misogi="${r.id}">${armed.has(mk) ? "本当に済ませた？" : "禊を済ませた"}</button></div>` : ""}
        <div class="actions">
          <input data-memo="${r.id}" id="memo-${r.id}" maxlength="40" placeholder="ひとこと（任意）" aria-label="${esc(r.name)}のメモ">
          <button class="btn primary" type="button" data-add="${r.id}">＋1</button>
        </div>
      </article>`;
    }).join("");
    document.querySelectorAll("[data-memo]").forEach((i) => { if (memos[i.dataset.memo]) i.value = memos[i.dataset.memo]; });
    if (focused) { const f = document.querySelector(`[data-memo="${focused}"]`); if (f) f.focus(); }
  }

  // log
  const ruleById = Object.fromEntries(S.rules.map((r) => [r.id, r]));
  const items = [
    ...S.offenses.filter((o) => o.who === who).map((o) => ({ ...o, k: "offenses" })),
    ...S.misogi.filter((m) => m.who === who).map((m) => ({ ...m, k: "misogi" })),
  ].sort((a, b) => (b.at || 0) - (a.at || 0)).slice(0, 25);
  $("#log").innerHTML = items.length
    ? `<ul>${items.map((it) => {
        const r = ruleById[it.rule]; const name = r ? r.name : "（削除したルール）";
        const key = `${it.k}:${it.id}`;
        const main = it.k === "misogi"
          ? `<span class="kind m">禊済</span><span class="txt">${esc(it.penance || (r && r.penance) || "")}<small>${esc(name)}</small></span>`
          : `<span class="kind">＋1</span><span class="txt">${esc(name)}${it.note ? `<small>${esc(it.note)}</small>` : ""}</span>`;
        return `<li>${main}<time>${fmt(it.at)}</time><button class="x${armed.has(key) ? " armed" : ""}" type="button" data-del="${key}" aria-label="この記録を取り消す">${armed.has(key) ? "取消？" : "×"}</button></li>`;
      }).join("")}</ul>`
    : `<div class="empty" style="border:0">${esc(S.people[who])}の記録はまだありません。</div>`;

  // settings rule rows
  $("#ruleRows").innerHTML = rules.length
    ? rules.map((r) => {
        const key = `rule:${r.id}`;
        return `<div class="rule-row"><span>${esc(r.name)}<br><small>${esc(r.threshold)}回 → ${esc(r.penance)}</small></span>
          <button class="btn small" type="button" data-edit="${r.id}">編集</button>
          <button class="btn small${armed.has(key) ? " shu" : ""}" type="button" data-delrule="${r.id}">${armed.has(key) ? "記録ごと削除" : "削除"}</button></div>`;
      }).join("")
    : `<p class="status">ルールはまだありません。</p>`;
}

function fillPeopleForm() {
  if (document.activeElement && (document.activeElement.id === "nameA" || document.activeElement.id === "nameB")) return;
  $("#nameA").value = S.people.a; $("#nameB").value = S.people.b;
}

function arm(key) {
  armed.add(key); render();
  setTimeout(() => { if (armed.delete(key)) render(); }, 4000);
}

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.who) {
    who = b.dataset.who; try { localStorage.setItem("misogi-who", who); } catch (err) {} render(); return;
  }
  if (b.dataset.add) {
    const id = b.dataset.add; const memo = document.querySelector(`[data-memo="${id}"]`);
    const note = memo ? memo.value.trim() : "";
    api.add("offenses", { rule: id, who, note, at: Date.now() });
    if (memo) memo.value = "";
    const card = document.querySelector(`[data-card="${id}"]`);
    if (card) { card.classList.remove("pulse"); void card.offsetWidth; card.classList.add("pulse"); }
    const r = S.rules.find((x) => x.id === id);
    toast(`${S.people[who]}の「${r ? r.name : ""}」を記録しました`);
    return;
  }
  if (b.dataset.misogi) {
    const id = b.dataset.misogi; const key = `m-${id}`;
    if (!armed.has(key)) return arm(key);
    armed.delete(key);
    const r = S.rules.find((x) => x.id === id); if (!r) return;
    api.add("misogi", { rule: id, who, consumed: Math.max(1, Number(r.threshold) || 1), penance: r.penance, at: Date.now() });
    toast("禊を済ませました。清められました");
    return;
  }
  if (b.dataset.del) {
    const key = b.dataset.del;
    if (!armed.has(key)) return arm(key);
    armed.delete(key);
    const [col, id] = key.split(":"); api.del(col, id); toast("記録を取り消しました");
    return;
  }
  if (b.dataset.edit) {
    const r = S.rules.find((x) => x.id === b.dataset.edit); if (!r) return;
    editingRule = r.id;
    $("#ruleName").value = r.name; $("#ruleThreshold").value = r.threshold; $("#rulePenance").value = r.penance;
    $("#ruleFormTitle").textContent = "ルールを編集"; $("#ruleSubmit").textContent = "保存する"; $("#ruleCancel").hidden = false;
    $("#ruleName").focus();
    return;
  }
  if (b.dataset.delrule) {
    const id = b.dataset.delrule; const key = `rule:${id}`;
    if (!armed.has(key)) return arm(key);
    armed.delete(key);
    (async () => {
      for (const o of S.offenses.filter((x) => x.rule === id)) await api.del("offenses", o.id);
      for (const m of S.misogi.filter((x) => x.rule === id)) await api.del("misogi", m.id);
      await api.del("rules", id);
      toast("ルールを削除しました");
    })();
  }
});

function resetRuleForm() {
  editingRule = null; $("#ruleForm").reset();
  $("#ruleFormTitle").textContent = "ルールを追加"; $("#ruleSubmit").textContent = "追加する"; $("#ruleCancel").hidden = true;
}
$("#ruleCancel").addEventListener("click", resetRuleForm);
$("#ruleForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const name = $("#ruleName").value.trim(); const penance = $("#rulePenance").value.trim();
  const threshold = Math.max(1, Math.min(999, parseInt($("#ruleThreshold").value, 10) || 0));
  if (!name || !penance || !threshold) { toast("内容・回数・禊をすべて入力してください"); return; }
  if (editingRule) {
    const r = S.rules.find((x) => x.id === editingRule);
    api.set("rules", editingRule, { name, threshold, penance, createdAt: r ? r.createdAt : Date.now() });
    toast("ルールを保存しました");
  } else {
    api.add("rules", { name, threshold, penance, createdAt: Date.now() });
    toast("ルールを追加しました");
  }
  resetRuleForm();
});
$("#peopleForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const a = $("#nameA").value.trim() || "わたし"; const b = $("#nameB").value.trim() || "あいて";
  api.people({ a, b }); toast("名前を保存しました");
});

fillPeopleForm(); render();
</script>
</body>
</html>
